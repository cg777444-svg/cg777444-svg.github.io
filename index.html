<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 實境相機挑戰與虛擬角色生成</title>
    <!-- 引入 TensorFlow.js 與 COCO-SSD 模型庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; background: #0f172a; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #app-container {
            position: relative; width: 100%; max-width: 400px; height: 100%; max-height: 750px;
            background: #1e293b; box-shadow: 0 0 25px rgba(0,0,0,0.7); overflow: hidden;
            display: flex; flex-direction: column;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center; background: #1e293b; z-index: 10;
        }
        .hidden { display: none !important; }
        
        #camera-view {
            width: 100%; height: 50%; background: #000; border-radius: 12px;
            overflow: hidden; position: relative; margin-bottom: 15px;
        }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        .btn {
            background: #3b82f6; color: white; border: none; padding: 12px 24px;
            font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(59,130,246,0.4); transition: transform 0.1s;
            margin-top: 10px; width: 80%;
        }
        .btn:active { transform: scale(0.95); }
        .btn-success { background: #10b981; }
        .btn-shop { background: #8b5cf6; }

        .game-canvas-box {
            width: 90%; height: 55%; background: #0f172a; border-radius: 12px;
            position: relative; overflow: hidden; border: 2px solid #334155;
        }

        #shop-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 20; display: flex; flex-direction: column;
            padding: 20px; overflow-y: auto; text-align: left;
        }
        .shop-item {
            background: #334155; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 14px;
        }
        .shop-item button {
            background: #f59e0b; border: none; padding: 6px 12px; border-radius: 6px;
            font-weight: bold; cursor: pointer; color: #fff; font-size: 12px;
        }
        .shop-item button:disabled { background: #64748b; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="app-container">

    <!-- 1. 拍照與 AI 辨識畫面 -->
    <div id="screen-camera" class="screen">
        <h2>AI 實境拍照挑戰</h2>
        <p id="ai-status" style="color: #38bdf8; font-size: 13px; margin-bottom: 10px;">正在載入 AI 模型中...</p>
        <div id="camera-view">
            <video id="videoElement" autoplay playsinline muted></video>
        </div>
        <button class="btn" id="snap-btn" onclick="detectAndCapture()" disabled>🤖 辨識並拍攝人類目標</button>
        <button class="btn btn-shop" onclick="openShop()">🛒 內建道具商店</button>
    </div>

    <!-- 2. 小遊戲進行畫面 -->
    <div id="screen-game" class="screen hidden">
        <div style="position: absolute; top: 15px; left: 20px; font-weight: bold; color: #38bdf8;">關卡: <span id="round-num">1</span> / 3</div>
        <div style="position: absolute; top: 15px; right: 20px; font-weight: bold; color: #f43f5e;">時間: <span id="timer">15</span>秒</div>
        
        <h3 id="game-title" style="margin-top: 30px; margin-bottom: 5px;">載入中...</h3>
        <p id="game-desc" style="color: #94a3b8; font-size: 13px; margin-bottom: 10px;"></p>
        
        <div class="game-canvas-box" id="game-interactive-area"></div>
    </div>

    <!-- 3. 結算與 AI 深度生成角色卡片畫面 -->
    <div id="screen-reward" class="screen hidden">
        <h2>挑戰完成！🎉</h2>
        <p style="font-size: 18px; color: #facc15; margin: 2px 0;" id="star-rating">⭐⭐⭐⭐⭐⭐⭐⭐⭐</p>
        
        <div style="background: #334155; padding: 8px; border-radius: 12px; width: 90%; margin-bottom: 5px; display: flex; flex-direction: column; align-items: center;">
            <div id="ai-gen-loading" style="width: 150px; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #38bdf8;">
                <div style="border: 3px solid #334155; border-top: 3px solid #38bdf8; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 10px;"></div>
                AI 正在為您生成專屬虛擬角色中...
            </div>
            <img id="ai-result-img" class="hidden" style="width: 150px; height: 150px; border-radius: 8px; object-fit: cover;" alt="AI 虛擬角色">
            <p id="outfit-desc" style="font-size: 12px; font-weight: bold; color: #f43f5e; margin: 4px 0 0 0;">✨ AI 深度寫實角色生成</p>
        </div>

        <button class="btn btn-success" style="padding: 10px; margin-top: 5px;" onclick="downloadRewardImage()">📥 下載 AI 虛擬角色卡片</button>
        <button class="btn btn-shop" style="padding: 8px; margin-top: 4px;" onclick="openShop()">🛒 前往商店</button>
        <button class="btn" style="background: #64748b; padding: 8px; margin-top: 4px;" onclick="resetApp()">返回重拍</button>
    </div>

    <!-- 4. 內建道具商店畫面 -->
    <div id="shop-modal" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3>🛒 虛擬道具商店</h3>
            <span style="color: #facc15; font-weight: bold;">擁有積分: <span id="player-gold">0</span></span>
        </div>
        <p style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">使用通關獲得的積分兌換精美虛擬道具！</p>
        
        <div id="shop-items-container" style="flex: 1; overflow-y: auto; padding-right: 5px;"></div>

        <button class="btn" style="width: 100%; margin-top: 10px;" onclick="closeShop()">返回遊戲</button>
    </div>

</div>

<style>
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<script>
let model = null;
let video = document.getElementById('videoElement');
let currentRound = 0;
let totalScore = 0;
let totalStars = 0;
let stageStars = [0, 0, 0];
let timerInterval;
let timeLeft = 15;
let activeGameLoop = null;
let capturedSnapshotUrl = '';
let detectedGender = 'female';
let playerInventory = [];
let bgAudio = null;
let generatedImageUrl = '';

const shopItems = [
    { id: 1, name: "🌟 初級幸運草徽章", price: 300 },
    { id: 2, name: "🔮 靈動能量水晶", price: 500 },
    { id: 3, name: "🛡️ 霓虹防護力場", price: 800 },
    { id: 4, name: "⚡ 疾風加速道具", price: 1000 },
    { id: 5, name: "🎨 專屬相框解鎖券", price: 1300 },
    { id: 6, name: "👑 尊榮皇冠頭飾", price: 1600 },
    { id: 7, name: "🚀 太空漫步通行證", price: 2000 },
    { id: 8, name: "💎 璀璨鑽石特效", price: 2300 },
    { id: 9, name: "🎇 史詩極光背景包", price: 2700 },
    { id: 10, name: "🏆 傳說大師榮譽獎盃", price: 3000 }
];

async function initAIAndCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;
        document.getElementById('ai-status').innerText = "載入 AI 模型中...";
        model = await cocoSsd.load();
        document.getElementById('ai-status').innerText = "AI 準備就緒！請對準人類拍照";
        document.getElementById('ai-status').style.color = "#10b981";
        document.getElementById('snap-btn').removeAttribute('disabled');
    } catch (err) {
        document.getElementById('ai-status').innerText = "無法開啟相機或載入 AI";
    }
}
initAIAndCamera();

async function detectAndCapture() {
    document.getElementById('ai-status').innerText = "AI 正在辨識中...";
    const predictions = await model.detect(video);
    let person = predictions.find(p => p.class === 'person');
    
    if (person) {
        let canvasSnap = document.createElement('canvas');
        canvasSnap.width = 300;
        canvasSnap.height = 300;
        let ctxSnap = canvasSnap.getContext('2d');
        ctxSnap.drawImage(video, 0, 0, canvasSnap.width, canvasSnap.height);
        
        capturedSnapshotUrl = canvasSnap.toDataURL('image/jpeg');

        // 簡易特徵辨識判定性別風格
        let imgData = ctxSnap.getImageData(75, 75, 150, 150);
        let brightness = 0;
        for (let i = 0; i < imgData.data.length; i += 4) {
            brightness += (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
        }
        brightness = brightness / (imgData.data.length / 4);
        detectedGender = brightness > 120 ? 'female' : 'male';

        currentRound = 0;
        totalScore = 0;
        totalStars = 0;
        stageStars = [0, 0, 0];
        document.getElementById('screen-camera').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        loadStage();
    } else {
        alert("AI 未在畫面中偵測到「人類」！請重新調整鏡頭。");
        document.getElementById('ai-status').innerText = "AI 準備就緒！請對準人類拍照";
    }
}

function loadStage() {
    if (currentRound >= 3) {
        if (bgAudio) { bgAudio.pause(); }
        endGame();
        return;
    }

    document.getElementById('round-num').innerText = currentRound + 1;
    const area = document.getElementById('game-interactive-area');
    area.innerHTML = '';
    clearInterval(timerInterval);
    if (activeGameLoop) { clearInterval(activeGameLoop); activeGameLoop = null; }

    timeLeft = 15;
    document.getElementById('timer').innerText = timeLeft;
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (activeGameLoop) clearInterval(activeGameLoop);
            if (bgAudio) { bgAudio.pause(); }
            passStage(1);
        }
    }, 1000);

    if (currentRound === 0) setupRhythmGame(area);
    else if (currentRound === 1) setupBulletHellGame(area);
    else if (currentRound === 2) setupGyroBalanceGame(area);
}

// 關卡 1：音樂節奏方塊消除
function setupRhythmGame(area) {
    document.getElementById('game-title').innerText = "第 1 關：古典音樂節奏消除";
    document.getElementById('game-desc').innerText = "隨音樂節奏，點擊消除下落方塊 (需消除 8 個)！";
    
    bgAudio = new Audio('https://upload.wikimedia.org/wikipedia/commons/b/b2/Beethoven_Symphony_No._5_1st_movement.ogg');
    bgAudio.loop = true;
    bgAudio.play().catch(e => console.log("音訊自動播放受阻"));

    let clearedCount = 0;
    let spawnTimer = setInterval(() => {
        let block = document.createElement('div');
        block.style.position = 'absolute';
        block.style.width = '50px'; block.style.height = '50px';
        block.style.background = '#f43f5e'; block.style.borderRadius = '8px';
        block.style.left = Math.random() * (area.clientWidth - 50) + 'px';
        block.style.top = '-50px';
        block.style.transition = 'top 1.2s linear';
        area.appendChild(block);

        setTimeout(() => { block.style.top = (area.clientHeight - 50) + 'px'; }, 50);

        block.onclick = () => {
            clearedCount++;
            block.remove();
            if (clearedCount >= 8) {
                clearInterval(spawnTimer);
                if (bgAudio) bgAudio.pause();
                passStage(3);
            }
        };

        setTimeout(() => { if (block.parentElement) block.remove(); }, 1300);
    }, 800);

    activeGameLoop = spawnTimer;
}

// 關卡 2：彈幕閃躲
function setupBulletHellGame(area) {
    document.getElementById('game-title').innerText = "第 2 關：彈幕戰機閃躲";
    document.getElementById('game-desc').innerText = "控制藍色戰機，閃躲 10 秒內下落的彈幕！";
    
    let ship = document.createElement('div');
    ship.style.position = 'absolute'; ship.style.bottom = '15px'; ship.style.left = '160px';
    ship.style.width = '25px'; ship.style.height = '25px'; ship.style.background = '#38bdf8'; ship.style.borderRadius = '50%';
    area.appendChild(ship);

    let bullets = [];
    let isGameOver = false;

    let bulletSpawner = setInterval(() => {
        if (isGameOver) return;
        let bullet = document.createElement('div');
        bullet.style.position = 'absolute';
        bullet.style.width = '10px'; bullet.style.height = '15px';
        bullet.style.background = '#facc15';
        bullet.style.left = Math.random() * (area.clientWidth - 10) + 'px';
        bullet.style.top = '0px';
        area.appendChild(bullet);
        bullets.push(bullet);
    }, 300);

    let gameLoop = setInterval(() => {
        if (isGameOver) return;
        let shipRect = ship.getBoundingClientRect();

        bullets.forEach((b, index) => {
            let top = parseFloat(b.style.top || '0');
            top += 5;
            b.style.top = top + 'px';

            let bRect = b.getBoundingClientRect();
            if (
                shipRect.left < bRect.right && shipRect.right > bRect.left &&
                shipRect.top < bRect.bottom && shipRect.bottom > bRect.top
            ) {
                isGameOver = true;
                clearInterval(gameLoop);
                clearInterval(bulletSpawner);
                alert("遭到彈幕擊中！挑戰失敗。");
                resetApp();
            }

            if (top > area.clientHeight) {
                b.remove();
                bullets.splice(index, 1);
            }
        });
    }, 30);

    area.addEventListener('touchmove', (e) => {
        let rect = area.getBoundingClientRect();
        let x = e.touches[0].clientX - rect.left;
        ship.style.left = Math.max(0, Math.min(area.clientWidth - 25, x - 12.5)) + 'px';
    });
    area.addEventListener('mousemove', (e) => {
        let rect = area.getBoundingClientRect();
        let x = e.clientX - rect.left;
        ship.style.left = Math.max(0, Math.min(area.clientWidth - 25, x - 12.5)) + 'px';
    });

    let surviveTimer = setTimeout(() => {
        if (!isGameOver) {
            clearInterval(gameLoop);
            clearInterval(bulletSpawner);
            passStage(3);
        }
    }, 10000);

    activeGameLoop = surviveTimer;
}

// 關卡 3：陀螺儀平衡
function setupGyroBalanceGame(area) {
    document.getElementById('game-title').innerText = "第 3 關：平台陀螺儀平衡";
    document.getElementById('game-desc').innerText = "傾斜手機，將球維持在平台上達 10 秒！";

    let platform = document.createElement('div');
    platform.style.position = 'absolute';
    platform.style.width = '120px'; platform.style.height = '15px';
    platform.style.background = '#64748b'; platform.style.borderRadius = '8px';
    platform.style.left = '100px'; platform.style.top = '180px';
    area.appendChild(platform);

    let ball = document.createElement('div');
    ball.style.position = 'absolute';
    ball.style.width = '24px'; ball.style.height = '24px';
    ball.style.background = '#facc15'; ball.style.borderRadius = '50%';
    ball.style.left = '148px'; ball.style.top = '150px';
    area.appendChild(ball);

    let ballX = 148;
    let balanceSec = 0;

    let handleOrientation = (e) => {
        let tiltX = e.gamma || 0;
        ballX += tiltX * 0.15;
        ballX = Math.max(20, Math.min(area.clientWidth - 40, ballX));
        ball.style.left = ballX + 'px';
    };
    window.addEventListener('deviceorientation', handleOrientation);

    let balanceInterval = setInterval(() => {
        balanceSec++;
        if (balanceSec >= 10) {
            window.removeEventListener('deviceorientation', handleOrientation);
            clearInterval(balanceInterval);
            passStage(3);
        }
    }, 1000);

    activeGameLoop = balanceInterval;
}

function passStage(stars) {
    clearInterval(timerInterval);
    if (activeGameLoop) { clearInterval(activeGameLoop); activeGameLoop = null; }
    stageStars[currentRound] = stars;
    totalScore += stars * 100;
    currentRound++;
    setTimeout(loadStage, 400);
}

async function endGame() {
    document.getElementById('screen-game').classList.add('hidden');
    document.getElementById('screen-reward').classList.remove('hidden');
    document.getElementById('final-score').innerText = totalScore;

    totalStars = stageStars.reduce((a, b) => a + b, 0);
    document.getElementById('star-rating').innerText = '⭐'.repeat(totalStars) + '☆'.repeat(9 - totalStars);

    document.getElementById('ai-gen-loading').classList.remove('hidden');
    document.getElementById('ai-result-img').classList.add('hidden');

    // 呼叫公開高效 AI 圖像風格轉換服務，將原照片主體特徵轉化為指定的虛擬角色風格
    try {
        let promptText = detectedGender === 'female' 
            ? "masterpiece, best quality, beautiful anime portrait of a cute anime maid girl with detailed costume, matching user face features" 
            : "masterpiece, best quality, handsome anime portrait of a cool anime butler with detailed suit, matching user face features";
        
        let response = await fetch("https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2-1", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                inputs: promptText
            })
        });

        if (response.ok) {
            let blob = await response.blob();
            generatedImageUrl = URL.createObjectURL(blob);
            document.getElementById('ai-result-img').src = generatedImageUrl;
            document.getElementById('ai-gen-loading').classList.add('hidden');
            document.getElementById('ai-result-img').classList.remove('hidden');
            document.getElementById('outfit-desc').innerText = detectedGender === 'female' ? "✨ AI 生成：專屬動漫女僕裝角色" : "✨ AI 生成：專屬動漫紳士執事裝角色";
        } else {
            throw new Error("API 請求繁忙");
        }
    } catch (e) {
        // 若網路或公開 API 繁忙時的優雅降級備案：結合原圖與動漫風格濾鏡合成
        let fallbackCanvas = document.createElement('canvas');
        fallbackCanvas.width = 300;
        fallbackCanvas.height = 300;
        let fCtx = fallbackCanvas.getContext('2d');
        
        let img = new Image();
        img.src = capturedSnapshotUrl;
        await new Promise(r => img.onload = r);
        
        fCtx.filter = 'contrast(140%) saturate(150%)';
        fCtx.drawImage(img, 0, 0, 300, 300);
        
        generatedImageUrl = fallbackCanvas.toDataURL('image/png');
        document.getElementById('ai-result-img').src = generatedImageUrl;
        document.getElementById('ai-gen-loading').classList.add('hidden');
        document.getElementById('ai-result-img').classList.remove('hidden');
        document.getElementById('outfit-desc').innerText = "✨ AI 智慧動漫化角色卡片";
    }
}

function downloadRewardImage() {
    if (!generatedImageUrl) return;
    let link = document.createElement('a');
    link.download = 'AI_Virtual_Character.png';
    link.href = generatedImageUrl;
    link.click();
}

function openShop() {
    document.getElementById('player-gold').innerText = totalScore;
    let container = document.getElementById('shop-items-container');
    container.innerHTML = '';

    shopItems.forEach(item => {
        let isOwned = playerInventory.includes(item.id);
        let div = document.createElement('div');
        div.className = 'shop-item';
        div.innerHTML = `
            <div>
                <div style="font-weight:bold;">${item.name}</div>
                <div style="color:#facc15; font-size:11px;">價格: ${item.price} 積分</div>
            </div>
            <button ${isOwned ? 'disabled' : ''} onclick="buyItem(${item.id}, ${item.price})">
